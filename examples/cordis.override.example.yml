# Example user patch for a DSH profile.
#
# Where to put it:  ~/.dsh/profiles/web/cordis.patch.yml   (or your own profile instead of web)
# What it is:       a regular loader patch applied AFTER bundle patches.
#                   It targets the already inserted plugin line by id and replaces its config.
#
# Important: the config field is replaced ENTIRELY, not merged with the config from the bundle
# patch. So list every key whose value you need; keys you omit get their defaults from
# lib/config.js.
#
# The full list of keys and their meaning — examples/config.example.json and docs/INSTALL.md.
# The external config.json (~/.config/fluent-case-builder/config.json) takes priority
# ABOVE this file, and environment variables rank even higher. For a personal machine the
# external config.json is usually enough; the profile patch is needed when the config must be
# part of the DSH profile (on a shared workstation, for example).

- id: fluent-case-builder
  name: 'fluent-case-builder'
  config:
    kbRoot: '/path/to/ansys-fluent-tui-kb'
    indexDir: '/path/to/ansys-fluent-tui-kb/90_RAW_TUI_OUTPUT/_data'
    caseRoots:
      - '/home/user/fluent-cases'
    templateRoots:
      my-project: '/path/to/my-project/templates'
    profileRoots:
      my-project: '/path/to/my-project/solutions'
    reportDir: '/home/user/fluent-cases/reports'
    allowRun: false
    fluentPath: '/opt/ansys_inc/v261/fluent/bin/fluent'
    licenseHost: '1055@localhost'

# You can temporarily disable the plugin in a profile (without removing the package) like this:
#
# - id: fluent-case-builder
#   disabled: true
#
# To set a runtime expression in the config, use a !!js scalar, for example:
#
# - id: fluent-case-builder
#   config:
#     reportDir: !!js "dshHomePath('reports')"
