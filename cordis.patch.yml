# Bundle patch: registers the fluent-case-builder plugin row in the profile.
# Only portable defaults live here. Machine-specific paths (kbRoot, caseRoots,
# templateRoots, profileRoots, fluentPath) belong in the external config:
#   ~/.config/fluent-case-builder/config.json  (or env FLUENT_CONFIG)
# or override the row by id in your own cordis.patch.yml:
#   - id: fluent-case-builder
#     config: { ... }
# Precedence: DEFAULTS -> this config -> external config.json -> environment
# variables.
- insert:
    - id: fluent-case-builder
      name: 'fluent-case-builder'
      config:
        allowRun: false
